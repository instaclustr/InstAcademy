site_name: InstAcademy · Vector Storage & Search for AI
site_description: InstAcademy OpenSearch hands-on labs — Optimizing OpenSearch Vector Storage and Search for Faster AI Applications
site_url: https://instaclustr.github.io/InstAcademy/
repo_url: https://github.com/instaclustr/InstAcademy
repo_name: instaclustr/InstAcademy

docs_dir: site-docs
strict: false

theme:
  name: material
  palette:
    - scheme: default
      primary: deep orange
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: deep orange
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - toc.follow
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/extra.css

plugins:
  - search
  - minify:
      minify_html: true

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

nav:
  - Home: index.md
  - Getting started:
      - Cluster setup: getting-started/cluster-setup/index.md
      - Fast mode (Bruno): fast-mode/bruno/index.md
  - Chapter 1:
      - Overview: chapter-1/index.md
      - Lesson 1 — Connectivity: chapter-1/lesson-1/index.md
      - Lesson 2 — Keyword index: chapter-1/lesson-2/index.md
      - Lesson 4 — Vector reindex: chapter-1/lesson-4/index.md
  - Chapter 2:
      - Overview: chapter-2/index.md
      - Lesson 1 — ML setup: chapter-2/lesson-1/index.md
      - Lesson 2 — Ingest & search: chapter-2/lesson-2/index.md
      - Lesson 4 — Cleanup: chapter-2/lesson-4/index.md
      - Lesson 5 — Routing: chapter-2/lesson-5/index.md
  - Chapter 3:
      - Overview: chapter-3/index.md
      - Lesson 1 — Hybrid sparse: chapter-3/lesson-1/index.md
  - Chapter 4:
      - Overview: chapter-4/index.md
      - Lesson 1 — RAG pipeline: chapter-4/lesson-1/index.md
      - Lesson 2 — Index tuning: chapter-4/lesson-2/index.md
      - Lesson 3 — Query optimization: chapter-4/lesson-3/index.md
  - Chapter 5:
      - Overview: chapter-5/index.md
      - Lesson 1 — Shards & health: chapter-5/lesson-1/index.md
      - Lesson 2 — Index optimization: chapter-5/lesson-2/index.md
      - Lesson 3 — Vector storage: chapter-5/lesson-3/index.md
      - Lesson 5 — Query backpressure: chapter-5/lesson-5/index.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/instaclustr/InstAcademy

copyright: Copyright &copy; NetApp Instaclustr
